name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --org com.wardi.tasbehi --project-name wardi_tasbehi /tmp/wardi_android
          cp -R /tmp/wardi_android/android ./android
      - name: Add Android permissions and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, marker + permissions)
          s = s.replace('android:label="wardi_tasbehi"', 'android:label="وردي وتسبيحي"')
          p.write_text(s)
          PY
      - name: Get packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardi-tasbehi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
